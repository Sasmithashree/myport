<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Header Section */
        header {
            background-color: #34495e;
            color: white;
            padding: 40px;
            text-align: center;
        }

        header img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        /* Main Content */
        .container {
            padding: 30px;
            max-width: 900px;
            margin: auto;
            background-color: white;
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #ddd;
            padding-bottom: 5px;
        }

        .skills, .projects, .contact {
            margin-bottom: 30px;
        }

        ul {
            list-style-type: square;
            padding-left: 20px;
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background-color: #34495e;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <img src="https://via.placeholder.com/150" alt="Profile Image">
        <h1>Your Name</h1>
        <p>Web Developer | Student | Beginner</p>
    </header>

    <div class="container">

        <section class="skills">
            <h2>Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>Basic JavaScript</li>
            </ul>
        </section>

        <section class="projects">
            <h2>Projects</h2>
            <p>Landing Page using HTML & CSS</p>
            <p>Personal Portfolio Website</p>

            <br>
            <a href="#" class="btn">For Demo Click</a>
        </section>

        <section class="contact">
            <h2>Contact Information</h2>
            <p>Email: yourname@gmail.com</p>
            <p>Phone: 9876543210</p>
        </section>

    </div>

    <footer>
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
